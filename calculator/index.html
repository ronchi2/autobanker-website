<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Preserve query parameters (like fbclid) and append the proper hash
        window.location.replace("/index.html" + window.location.search + "#calculator");
    </script>
</head>
<body>
    <p>Redirecting to the calculator... <a href="/index.html#calculator">Click here if not redirected.</a></p>
</body>
</html>
